'use strict';const API='https://wgjdhdssiveqedluktwi.supabase.co';const KEY='sb_publishable_SjpllvJDfzLQM7nD_0CnJQ_B31PCe_I';let data={};const escapeHtml=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=x=>x==null?'—':x;const unique=a=>[...new Set(a)];const officialSet=()=>new Set(data.hydra_races.filter(r=>r.status==='official').map(r=>String(r.id)));
function hydraOvrRatings(){
 const drivers=data.hydra_drivers||[],raceList=(data.hydra_races||[]).filter(x=>x.status==='official').sort((a,b)=>Number(a.round_number)-Number(b.round_number)||String(a.race_date||'').localeCompare(String(b.race_date||'')));
 const results=data.hydra_results||[],byId=new Map(drivers.map(d=>[String(d.id),d])),byName=new Map(),scores=new Map();
 const key=d=>String(d.gamertag||'').trim().toLocaleLowerCase('it');
 for(const d of drivers){const k=key(d);if(!k)continue;if(!byName.has(k))byName.set(k,[]);byName.get(k).push(d);const lk=k+'|'+d.league;if(!scores.has(lk))scores.set(lk,{elo:d.league==='A'?1600:1400,starts:0,finish:0,q:0,ren:0,cos:0,rac:0,streak:0})}
 const officialCount=new Map();for(const r of results){if(r.status==='dns'||!raceList.some(g=>String(g.id)===String(r.race_id)))continue;const d=byId.get(String(r.driver_id));if(!d)continue;const k=key(d)+'|'+d.league;officialCount.set(k,(officialCount.get(k)||0)+1)}
 const ratingEligible=d=>{const records=byName.get(key(d))||[];const otherPrimary=records.some(x=>x.league!==d.league&&x.team_id!=null);return !otherPrimary&&(officialCount.get(key(d)+'|'+d.league)||0)>=3};
 const clamp=(n,lo=1,hi=99)=>Math.max(lo,Math.min(hi,Math.round(n)));
 for(const race of raceList){
  const field=results.filter(r=>String(r.race_id)===String(race.id)).map(r=>({...r,driver:byId.get(String(r.driver_id))})).filter(r=>r.driver&&r.driver.league===race.league&&r.status!=='dns'&&r.driver.archived!==true);
  const starters=field.filter(r=>r.status==='classified'||r.status==='dnf'||r.status==='dsq');
  const size=starters.length;if(size<2)continue;
  const eligible=starters.filter(r=>ratingEligible(r.driver));
  const changes=new Map();
  for(const r of eligible){
   const s=scores.get(key(r.driver)+'|'+r.driver.league);if(!s)continue;
   const pos=Number(r.finishing_position),qual=Number(r.qualifying_position),finished=r.status==='classified'&&pos>0;
   const qScore=qual>0?1-(Math.min(qual,size)-1)/(size-1):.5;
   const fScore=finished?1-(Math.min(pos,size)-1)/(size-1):0;
   s.starts++;s.finish+=finished?1:0;s.q+=qScore;s.ren+=fScore;s.cos+=finished?fScore:0;s.rac+=finished?(qual>0?clamp(50+50*(qual-pos)/(size-1),0,100)/100:fScore):0;
   let delta=0,opponents=0;
   for(const other of eligible){if(other===r)continue;const os=scores.get(key(other.driver)+'|'+other.driver.league);if(!os)continue;
    const expected=1/(1+Math.pow(10,(os.elo-s.elo)/400));
    const otherFinished=other.status==='classified'&&Number(other.finishing_position)>0;
    const actual=finished&&otherFinished?(pos<Number(other.finishing_position)?1:pos===Number(other.finishing_position)?.5:0):finished?1:otherFinished?0:.5;
    delta+=actual-expected;opponents++;
   }
   const averageDelta=opponents?delta/opponents:0;const nextStreak=averageDelta>0?s.streak+1:0;const kFactor=averageDelta>0?(nextStreak>=4?25:nextStreak===3?24:nextStreak===2?22:20):20;
   changes.set(key(r.driver)+'|'+r.driver.league,{delta:kFactor*averageDelta,streak:nextStreak});
  }
  for(const [k,change] of changes){scores.get(k).elo+=change.delta;scores.get(k).streak=change.streak;}
 }
 const out=new Map();
 for(const [name,records] of byName){
  const played=[...new Set(records.filter(ratingEligible).map(d=>d.league))].map(l=>scores.get(name+'|'+l)).filter(s=>s&&s.starts);
  if(!played.length){out.set(name,null);continue}
  const primary=played.slice().sort((a,b)=>b.starts-a.starts)[0];
  const total=played.reduce((n,s)=>n+s.starts,0),sum=prop=>played.reduce((n,s)=>n+s[prop],0),avg=prop=>sum(prop)/total;
  const ratingA=records.some(d=>d.league==='A'&&ratingEligible(d)&&scores.get(name+'|A')?.starts);
  const leagueScore=ratingA?scores.get(name+'|A'):primary;
  const mapOvr=(elo,league)=>league==='A'?clamp((elo-700)/10,81,100):clamp(elo<=1400?70+(elo-1400)/10:70+(elo-1400)/6,60,80);const ovr=mapOvr(leagueScore.elo,ratingA?'A':'B');
  const scoreA=scores.get(name+'|A'),scoreB=scores.get(name+'|B');const ovrA=scoreA?.starts&&records.some(d=>d.league==='A'&&ratingEligible(d))?mapOvr(scoreA.elo,'A'):null;const ovrB=scoreB?.starts&&records.some(d=>d.league==='B'&&ratingEligible(d))?mapOvr(scoreB.elo,'B'):null;out.set(name,{ovr,ovrA,ovrB,elo:Math.round(leagueScore.elo),vel:clamp(1+98*avg('q')),ren:clamp(1+98*avg('ren')),cos:clamp(1+98*avg('cos')),rac:clamp(1+98*avg('rac')),aff:clamp(100*(sum('finish')+2)/(total+2.5)),races:total});
 }
 return out;
}

function lineChart(values,unit){if(!values.length)return '<p class="hp-muted">Nessuna gara ufficiale.</p>';const w=600,h=190,p=28;const lo=Math.min(...values.map(x=>x.value)),hi=Math.max(...values.map(x=>x.value));const pts=values.map((x,i)=>[p+(w-2*p)*(values.length===1?.5:i/(values.length-1)),h-p-(h-2*p)*(hi===lo?.5:(x.value-lo)/(hi-lo))]);return '<svg class="hp-chart" viewBox="0 0 600 190" role="img" aria-label="Andamento '+escapeHtml(unit)+'"><line x1="28" y1="162" x2="572" y2="162" stroke="#50637b"/><polyline fill="none" stroke="#e3bf76" stroke-width="3" points="'+pts.map(p=>p.join(',')).join(' ')+'"/>'+pts.map((p,i)=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4" fill="#f1d59c"><title>'+escapeHtml(values[i].label+': '+values[i].value)+'</title></circle>').join('')+'<text x="28" y="18" fill="#a6b4c6" font-size="13">Max '+hi+' · Min '+lo+'</text></svg>'}
function renderProfile(){const id=new URLSearchParams(location.search).get('id');const d=data.hydra_drivers.find(x=>String(x.id)===String(id));if(!d){document.querySelector('#profile').textContent='Pilota non trovato.';return}const team=data.hydra_teams.find(t=>String(t.id)===String(d.team_id));const official=officialSet(),raceById=new Map(data.hydra_races.map(r=>[String(r.id),r]));const records=data.hydra_results.filter(r=>String(r.driver_id)===String(d.id)&&official.has(String(r.race_id))&&r.status!=='dns').sort((a,b)=>{const ra=raceById.get(String(a.race_id)),rb=raceById.get(String(b.race_id));return String(ra?.race_date||'').localeCompare(String(rb?.race_date||'')||Number(ra?.round_number||0)-Number(rb?.round_number||0)});const finished=records.filter(r=>r.status==='classified'&&Number(r.finishing_position)>0);const points=records.reduce((n,r)=>n+Number(r.points||0),0),wins=finished.filter(r=>Number(r.finishing_position)===1).length,podiums=finished.filter(r=>Number(r.finishing_position)<=3).length,poles=records.filter(r=>Number(r.qualifying_position)===1).length,fast=records.filter(r=>r.fastest_lap===true).length;const rating=hydraOvrRatings().get(d.gamertag.trim().toLocaleLowerCase('it')),ovr=d.league==='A'?rating?.ovrA:rating?.ovrB;const skills=[['VEL',rating?.vel],['REN',rating?.ren],['COS',rating?.cos],['RAC',rating?.rac],['AFF',rating?.aff]];const stats=[['Gare ufficiali',records.length],['Punti',points],['Vittorie',wins],['Podi',podiums],['Pole position',poles],['Giri veloci',fast],['Miglior arrivo',finished.length?Math.min(...finished.map(r=>Number(r.finishing_position)))+'°':'—'],['Arrivi al traguardo',records.length?Math.round(100*finished.length/records.length)+'%':'—']];document.title=d.gamertag+' | Hydra Esports';document.querySelector('#profile').outerHTML='<section class="hp-hero"><div class="hp-number">'+escapeHtml(d.race_number??'—')+'</div><div><div class="hp-kicker">HYDRA ESPORTS · LEGA '+escapeHtml(d.league)+'</div><h1>'+escapeHtml(d.gamertag)+'</h1><p class="hp-muted">'+escapeHtml(team?.name||'Pilota WILD')+'</p></div><div class="hp-ovr"><span class="hp-kicker">HYDRA OVR</span><strong>'+fmt(ovr)+'</strong><small class="hp-muted">'+(ovr==null?'Minimo 3 gare':'Valutazione dinamica')+'</small></div></section><section class="hp-grid">'+stats.map(([k,v])=>'<div class="hp-stat"><strong>'+escapeHtml(v)+'</strong><small>'+escapeHtml(k)+'</small></div>').join('')+'</section><div class="hp-layout"><section class="hp-panel"><h2>Caratteristiche pilota</h2>'+(ovr==null?'<p class="hp-muted">Valutazione disponibile dopo 3 gare ufficiali.</p>':skills.map(([k,v])=>'<div class="hp-skill"><b>'+k+'</b><div class="hp-track"><div class="hp-fill" style="width:'+Math.max(0,Math.min(100,Number(v)||0))+'%"></div></div><b>'+fmt(v)+'</b></div>').join(''))+'</section><section class="hp-panel"><h2>Andamento punti per GP</h2>'+lineChart(records.map((r,i)=>({label:raceById.get(String(r.race_id))?.circuit||'GP '+(i+1),value:Number(r.points||0)})),'punti')+'</section></div><section class="hp-panel hp-full"><h2>Storico gare ufficiali</h2><div class="hp-scroll"><table class="hp-table"><thead><tr><th>GP</th><th>Lega</th><th>Qualifica</th><th>Arrivo</th><th>Punti</th><th>Scuderia</th></tr></thead><tbody>'+records.map(r=>{const race=raceById.get(String(r.race_id)),t=data.hydra_teams.find(t=>String(t.id)===String(r.team_id));return '<tr><td>'+escapeHtml(race?.circuit||'GP')+'</td><td>'+escapeHtml(race?.league||d.league)+'</td><td>'+escapeHtml(r.qualifying_position?Number(r.qualifying_position)+'°':'—')+'</td><td>'+escapeHtml(r.status==='classified'&&r.finishing_position?Number(r.finishing_position)+'°':r.status?.toUpperCase()||'—')+'</td><td>'+escapeHtml(r.points||0)+'</td><td>'+escapeHtml(t?.name||'WILD')+'</td></tr>'}).join('')+'</tbody></table>'+(records.length?'':'<p class="hp-muted">Nessuna gara registrata.</p>')+'</div></section>'}
(async()=>{try{await Promise.all(['hydra_drivers','hydra_teams','hydra_races','hydra_results'].map(async t=>{const r=await fetch(API+'/rest/v1/'+t+'?select=*&order=id.asc',{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});if(!r.ok)throw Error('Dati non disponibili ('+r.status+')');data[t]=await r.json()}));renderProfile()}catch(e){document.querySelector('#profile').textContent='Impossibile caricare il profilo: '+e.message}})();
</script></body></html>
